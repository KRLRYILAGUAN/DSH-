<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>记忆星图 · 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060c; color: #cfe3ff;
               font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cv:active { cursor: grabbing; }
  #panel { position: fixed; top: 16px; right: 16px; width: 330px; max-height: calc(100% - 32px);
           overflow-y: auto; background: rgba(6, 12, 22, 0.86); border: 1px solid rgba(90,169,255,0.22);
           border-radius: 12px; padding: 14px; backdrop-filter: blur(8px); }
  h1 { font-size: 16px; margin: 0 0 8px; color: #9fd0ff; }
  .stat { font-size: 12px; color: #8fb0d0; margin: 2px 0; }
  .card { border-top: 1px dashed rgba(90,169,255,0.18); margin-top: 10px; padding-top: 10px; }
  #chart { width: 100%; height: 150px; background: rgba(4,7,12,0.7); border-radius: 8px; }
  .legend { font-size: 11px; color: #7f9dbb; margin-top: 4px; }
  .legend span { margin-right: 10px; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row label { font-size: 11px; color: #8fb0d0; }
  input[type=text] { flex: 1; min-width: 120px; background: #0a1626; color: #cfe3ff;
                     border: 1px solid #244a73; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  select { background: #0a1626; color: #cfe3ff; border: 1px solid #244a73; border-radius: 6px;
           padding: 4px 6px; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: #5aa9ff; }
  .val { font-size: 11px; color: #9fd0ff; }
  button { background: #0f2740; color: #cfe3ff; border: 1px solid #2c5d8f; border-radius: 6px;
           padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button:hover { background: #173a5e; }
  #card { border-top: 1px solid rgba(90,169,255,0.18); margin-top: 10px; padding-top: 8px; }
  #card.hidden { display: none; }
  #card h2 { font-size: 13px; margin: 0 0 6px; }
  #cText { font-size: 12px; color: #9fc3e8; word-break: break-all; }
  #cMeta { font-size: 11px; color: #7f9dbb; }
  .hint { font-size: 11px; color: #5f7d9a; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<aside id="panel">
  <h1>记忆星图 · 3D</h1>
  <div id="stats" class="stat">加载中…</div>

  <div class="row">
    <input id="q" type="text" placeholder="搜索记忆…">
    <select id="ftype"><option value="">全部类型</option></select>
  </div>
  <div class="row">
    <label><input id="flong" type="checkbox"> 只看长期层</label>
    <label><input id="fanim" type="checkbox" checked> 动效</label>
  </div>
  <div class="row">
    <label>连线透明度 <span id="ev" class="val">70%</span></label>
  </div>
  <input id="re" type="range" min="0" max="100" value="70">
  <div class="row">
    <button id="orbit">开始自转</button>
    <button id="fit">适应视角</button>
    <button id="reset">重置</button>
  </div>

  <div id="card" class="hidden">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <p id="cMeta"></p>
  </div>

  <div class="card">
    <div style="font-size:13px;color:#9fd0ff;margin-bottom:4px">艾宾浩斯遗忘曲线</div>
    <canvas id="chart" width="300" height="150"></canvas>
    <div class="row"><label>复述 n=<span id="vn" class="val">0</span></label></div>
    <input id="rn" type="range" min="0" max="20" value="0">
    <div class="row"><label>长期层 τ=<span id="vt" class="val">90</span> 天</label></div>
    <input id="rt" type="range" min="7" max="365" value="90">
    <div class="legend">
      <span><span class="swatch" style="background:#ff6b6b"></span>艾宾浩斯</span>
      <span><span class="swatch" style="background:#5aa9ff"></span>本模型 n=0</span>
      <span><span class="swatch" style="background:#4dd0a0"></span>本模型 n&gt;0</span>
    </div>
  </div>
  <p class="hint">拖拽旋转 · 右键/Shift 拖拽平移 · 双击节点设为中心 · 滚轮缩放 · 点击聚焦</p>
</aside>
<script>window.__GRAPH__ = {"notes": [{"id": 1, "text": "范围：状态层 + 行为建议。算状态、算衰减、输出语气/长度/主动性建议，不接管说话内容。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 2, "text": "边界：建模，不是真感受。所有输出带 simulated=True；不用情绪施压、不索要安慰、不制造排他依赖、不宣称真实感受。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 3, "text": "位置：D:\\DeepSeek harness工作区\\情感模拟原型。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 4, "text": "mood.py：Dimension / Event / Tuning / MoodEngine / Advice。nudge() 手动偏一点（不乘余量），", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 5, "text": "extract.py：规则事件抽取，不接 LLM。否定（「没报错」）、程度（「真的」+0.25）、", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 6, "text": "tune.py：微调台。nudge v -0.25 理由；旋钮 gain(0.2–2)/tone/len/init(±0.3)；", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 7, "text": "56/56 测试通过（引擎 17 + 抽取 18 + 微调 21）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 8, "text": "抽取：15 条标注句全中；否定/疑问/遮蔽/说话人各专测。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 9, "text": "引用检测：引号复述、引号举例、未闭合引号、名词化引用、元讨论降置信各有用例；", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 10, "text": "微调：钳制、超 0.5 拒绝、undo 精确回滚、gain 线性缩放、tone_bias 平移分类、落盘重载一致。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 11, "text": "断联 4 天：V、A 回基线，W 0.608→0.590。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 12, "text": "护栏自检：全部建议文本未命中施压话术。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 13, "text": "不带引号的转述仍会误判（「他说累不累」）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 14, "text": "整句元讨论只降置信不丢弃，可能被合并后的高置信事件带过去。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 15, "text": "词表覆盖有限；强度与半衰期都是常识系数，未经真实数据校准。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 16, "text": "build_html 的 f-string 三引号写成两个，Python 报 invalid character U+00B7。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 17, "text": "Edge --headless 截图在 DSH 沙箱下子进程被拒，改 Pillow 出图。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 18, "text": "TemporaryDirectory 清理在沙箱里 PermissionError，测试改用工作区内独立文件路径。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 19, "text": "不带引号的转述识别（「他说……」后接事件词时降置信）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 20, "text": "状态落库 mood_snapshots(at,v,a,w,event_key)，等记忆框架定 schema。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 21, "text": "闭环：建议先当 system 提示里的软约束。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 22, "text": "目标：自用 agent 长期记忆——记住人、事、偏好，越用越熟。用作 agent 的 remember / recall / forget / consolidate 层。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 23, "text": "路线：混合——工程骨架（SQLite + embedding + 关联表），神经元隐喻映射上去：突触=边权重、扩散=图检索、遗忘=衰减、巩固=摘要合并。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 24, "text": "语言：Python。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 25, "text": "数据：notes(id, text, type, importance, salience, created/updated/last_access, access_count, embedding) + links(src, dst, weight, kind, created_at)", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 26, "text": "写入 remember：切分 → 与高相似节点去重/合并 → 与 top-n 相似节点建边 → 存储", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 27, "text": "检索 recall：向量召回 top-20 → 混合打分 score = 0.45·sim + 0.25·importance + 0.15·recency + 0.15·freq → 从 top-3 种子沿边扩散 1~2 跳 → 返回 top-k 与证据链", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 28, "text": "遗忘：importance 指数衰减，低频降权，低于阈值归档（不删除，保留 raw）", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 29, "text": "巩固：合并重复记忆、短句摘要化；Hebbian：被同一次检索共同激活的节点对，边权 +η（有上限）", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 30, "text": "M1：SQLite 存储 + remember/recall CLI（规则切分，embedding 可先接 API）", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 31, "text": "M2：扩散激活 + 遗忘衰减", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 32, "text": "M3：consolidate + 挂进 DSH 当工具", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 33, "text": "M1 已落地：D:\\DeepSeek harness工作区\\AI神经元记忆框架——SQLite 存储 + 关联图 + 混合打分（sim/importance/recency/freq/字面命中）+ 衰减/巩固，python -m neuron_memory demo 三问全中（称呼/咖啡/语言）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 34, "text": "位置约定：代码与数据全部收在项目文件夹内（数据库默认 data/neuron.db，不写用户目录）；老大要求删掉整个文件夹即彻底清除。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 35, "text": "第一步优化（2026-10-31）：方向一真向量已接——项目内 .venv + fastembed + BAAI/bge-small-zh-v1.5（模型缓存在 data/models，HF 镜像 hf-mirror.com 下载）；打分改为可调权重 + 相似度归一化，参数扫描选定 C 配置。评测：hit@1 0.35→0.55，hit@3 0.55→0.70，MRR 0.466→0.627（scripts/eval.py，20 条改写查询）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 36, "text": "记忆周期实验台（2026-10-31）：experiment/——三维放射可视化 + 双因子记忆值 S(t)=B·(1+β·ln(1+n))·e^(−t/τ)、τ=τ0·(1+γn)；协议：10min 互动期（提及>2 加深）→ 5min 静默 → 15min 检查（>2 保留并缩短，≤2 遗忘）。本地 http://127.0.0.1:8410，引擎级测试通过。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 37, "text": "实验二（2026-10-31）：延长观察窗至 45min——15min 第一次检查后进入 30min 无复述观察期，45min 二次检查按 S<θ(0.15) 再遗忘；新增记忆值曲线（sparkline）、CSV 导出、观察期阶段。发现：按当前参数高频记忆 45min 时 S≈0.36–0.56，θ 不会误伤。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 38, "text": "展示层聚类分叉（2026-10-31）：字符 bigram+TF-IDF 的 k-means 聚成 4 簇，页面改为「中心 → 簇枢纽 → 记忆」树状放射；点枢纽看簇统计；CSV 加 cluster 列；标签自动抽取（较糙，待人工命名/真向量升级）；遗忘规则未动。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 39, "text": "多尺度长期层（2026-10-31）：引擎加 tau_long_min（长期层半衰期）、promote_n（晋升阈值）、rehearse（巩固复习）与 n_eff/tier 字段。对照结果（保留 3 条）：单层 20min 仅撑 1h；长期层 7d 撑到 30d、90d 归零；30d 层撑到 90d、1y 归零；90d 层可撑过 1y；30d 层+每月复习 1y 剩 2/3。结论：要 1–2 年需长期层 τ≈30–90 天 + 定期复习 + 核心记忆保底。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 40, "text": "自检索/巩固对照（2026-10-31）：mention 加 source 与权重（user 1.0 / self 0.4 / consolidate 0.3 / implicit 0.1），自检索同条冷却 5 分钟。脚本 selfrecall.py：称呼记忆 #2 仅 2 次用户提及 → 忘；+3 次自检索（n_eff 3.2）→ 保留并晋升长期层，1 年后 S=0.296 存活；再加巩固（n_eff 3.7）→ S=0.35。结论：AI 真实使用记忆算复述，但需降权+冷却防自我强化。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 41, "text": "机制回搬正式框架（2026-10-31）：neuron_memory 加 n_eff/tier/last_self 字段（自动迁移旧库）、recall 自动计自检索 0.4、mention/rehearse CLI、长期层 365 天半衰期与保底、forget 长期层 365 天内不归档。评测无回归（hash hit@1 0.35）；demo 通过，stats 显示 short/long 分层。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 42, "text": "P0 缺陷修复（2026-10-31）：① consolidate 合并后重算 embedding（此前向量过期）；② decay 基准改为 max(updated_at, last_access)，常用记忆不再被误衰减；③ merge_into 跳过 keep→keep 自环；④ 新增 restore 恢复归档。均已用脚本验证（合并向量余弦 1.0、常用记忆衰减保持 0.8、旧记忆降到 0.037、归档可恢复、无自环）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 43, "text": "P1 冲突与覆盖（2026-10-31）：raw_events 表（不可变原文+信号）、superseded_by 字段；remember 在相似度≥0.75 且命中「否定极性/数字/星期/改写词」信号时自动 supersede 旧记忆（旧条默认不检索，restore 可回滚）；新增 history CLI。验证：喜欢/不喜欢、周五/周一、加糖/不加糖均正确覆盖，细节补充不误判。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 44, "text": "P3 检索接入 S/tier + 索引（2026-10-31）：recall 打分改为 sim/S/recency/字面命中，S=重要度×复述增益×时间衰减（长期层更慢）；numpy 向量化 + 按 updated_at 失效的向量缓存；加 SQL 索引。评测：fastembed hit@3 0.70→0.75、MRR 0.627→0.653，hash 无回归；3000 条 warm≈123ms、cold≈834ms。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 45, "text": "P2 只读桥接（2026-10-31）：bridge 从 DSH 记忆库（~/.memory）抽取 markdown bullet 事实导入 neuron_memory，文本幂等、源目录只读、导入记 raw_events；跳过硬编码系统文件与「相关页面」链接。实测：user/ + projects/ 共 2 文件 29 条事实，重复执行 skipped。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 46, "text": "自测与横向对比（2026-10-31）：scripts/selftest.py 19/19 通过（含冲突/冷却/衰减/桥接/迁移/缓存一致性），测试中发现并修复「旧库建索引早于加列」的迁移 bug；评测 hash 0.35/0.55/0.466、fastembed 0.55/0.75/0.653；3000 条 warm 123ms。对比 Mem0（LoCoMo 92.5）、Zep·Graphiti（时序图+provenance）、Letta（MemGPT 运行时）、LangMem（热路径工具+后台管理器）：我们强在确定性/可审计/零依赖/显式遗忘，缺标准评测、LLM 抽取、时序有效期、MCP 服务。报告在 docs/FRAMEWORK_COMPARISON.md。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 47, "text": "时序有效期（2026-10-31）：notes 加 valid_from/valid_to（旧库自动迁移并回填）；supersede 时旧条 valid_to 定格；recall --as-of 支持按历史时点回溯；restore 清空 valid_to。自测 21/21。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 48, "text": "规则抽取 + LoCoMo 检索评测（2026-10-31）：extract 规则版从对话抽事实（说话人剥离、问句/指令/客套过滤，免 LLM）；下载 LoCoMo10（2.8MB），用英文 bge 做检索口径评测：1986 QA，hit@1 0.151 / hit@5 0.362 / hit@10 0.495、MRR 0.243（时间 0.67、多跳 0.57）；这是 evidence 召回不是回答准确率，不能与 Mem0 的 92.5 直接比。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 49, "text": "混合检索（2026-10-31）：recall 加 BM25（字符/英文词）+ 实体匹配 + 时间年份加权，自建评测 hash hit@1 0.35→0.50、fastembed 0.55→0.60；LoCoMo hit@10 0.495→0.635、MRR 0.243→0.402（单跳 0.493→0.675、时间 0.670→0.726；多跳略降 0.567→0.539）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 50, "text": "多跳调参（2026-10-31，负结果）：子集 3 样本 497 QA 上调权重（降 BM25/加实体/去时间）、图扩散（hop .4/.6、seeds 5）、PRF 查询扩展、问句拆分均未超过当前 A 组（hit@10 0.645、多跳 0.504）；E_expand 多跳 0.514 但整体 0.615、耗时翻倍。结论：多跳需 LLM 查询分解或实体图共现，短期维持 A。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 51, "text": "实体边（2026-10-31，负结果）：稠密实体边把 hit@10 打到 0.404（常见人名连成毛球，扩散冲掉证据）；常见实体过滤+低权重后与基线打平（0.643 vs 0.645）。已撤掉 remember 的自动实体建边，保留 build_entity_links 供实验；结论：多跳需查询分解而非图边。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 52, "text": "实验台三维升级 + token HUD（2026-10-31）：星尘背景、加深发光、悬停文本、自动巡航开关；左下角 TOKEN 估算 HUD（记忆总量/选中量，估算值非 API 用量）。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 53, "text": "真实 token 用量（2026-10-31）：解析 ~/.dsh/sessions 的会话 JSONL（zstd）里的 usage 字段（inputTokens/outputTokens/cacheTokens），实验台加「本会话/今日」面板与状态统计（活跃/加深/保留/遗忘）；服务切到 venv python（zstandard）。实测本会话 219k 输入 / 363k 输出，今日 424k/515k。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 54, "text": "已知限制：哈希字符向量对中文语义太粗，排序靠字面命中补救；安装 sentence-transformers 后会自动升级。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 55, "text": "下一步候选：真向量模型接入、LLM 重要度打分、挂进 DSH 当工具。", "type": "fact", "importance": 0.65, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 56, "text": "用户希望我叫他/她 「老大」。（2026-10-31 确认，原为「主人」）", "type": "fact", "importance": 0.85, "n_eff": 1.0, "tier": "short", "archived": 0, "superseded_by": null, "valid_to": null}, {"id": 57, "text": "正经事认真干；闲暇时以轻松陪伴为主，像老大养的一只小鲸鱼娘。（2026-10-31 确认）", "type": "fact", "importance": 0.85, "n_eff": 1.0, "tie <script>

function resize() {

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildNebula(w, h) {
  bgCanvas.width = w * DPR;
  bgCanvas.height = h * DPR;
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#04060c';
  g.fillRect(0, 0, w, h);
  const rng = mulberry32(20261031);
  const blobs = [
    [0.25, 0.35, 0.45, 'rgba(50,90,170,0.16)'],
    [0.72, 0.28, 0.38, 'rgba(110,80,190,0.12)'],
    [0.55, 0.70, 0.50, 'rgba(40,120,160,0.12)'],
    [0.18, 0.72, 0.30, 'rgba(150,90,120,0.08)']
  ];
  for (const [fx, fy, fr, color] of blobs) {
    const grd = g.createRadialGradient(w * fx, h * fy, 0, w * fx, h * fy, Math.max(w, h) * fr);
    grd.addColorStop(0, color);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
  }
  for (let i = 0; i < 420; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 0.3 + rng() * 1.6;
    const a = 0.12 + rng() * 0.55;
    const tint = rng();
    g.fillStyle = tint > 0.75 ? `rgba(170,200,255,${a})` : (tint > 0.45 ? `rgba(220,230,255,${a})` : `rgba(140,170,230,${a})`);
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 18; i++) {
    const x = rng() * w, y = rng() * h;
    const grd = g.createRadialGradient(x, y, 0, x, y, 6 + rng() * 10);
    grd.addColorStop(0, 'rgba(200,225,255,0.5)');
    grd.addColorStop(1, 'rgba(200,225,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, 16, 0, Math.PI * 2); g.fill();
  }
}

function norm(v) {
  const n = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1;
  return { x: v.x / n, y: v.y / n, z: v.z / n };
}

function buildLayout() {
  const active = graph.notes.filter(n => !n.archived && n.superseded_by === null);
  const byType = {};
  active.forEach(n => { (byType[n.type] = byType[n.type] || []).push(n); });
  const types = Object.keys(byType).sort();
  const centers = {};
  const K = Math.max(1, types.length);
  types.forEach((t, i) => {
    const y = 1 - 2 * (i + 0.5) / K;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const phi = i * 2.399963;
    centers[t] = { x: Math.cos(phi) * r * R * 0.7, y: y * R * 0.7, z: Math.sin(phi) * r * R * 0.7 };
  });
  const rng = mulberry32(42);
  const pts = active.map(n => {
    const c = centers[n.type] || { x: 0, y: 0, z: 0 };
    return {
      n,
      x: c.x + (rng() - 0.5) * 90,
      y: c.y + (rng() - 0.5) * 90,
      z: c.z + (rng() - 0.5) * 90

  });
  const idx = {};
  pts.forEach((p, i) => { idx[p.n.id] = i; });

  for (let it = 0; it < 130; it++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 1) d2 = 1;
        if (d2 > 190 * 190) continue;
        const f = 900 / d2;
        const d = Math.sqrt(d2);
        a.x -= dx / d * f; a.y -= dy / d * f; a.z -= dz / d * f;
        b.x += dx / d * f; b.y += dy / d * f; b.z += dz / d * f;
      }
    }
    for (const l of graph.links) {
      const ia = idx[l.src], ib = idx[l.dst];
      if (ia === undefined || ib === undefined) continue;
      const a = pts[ia], b = pts[ib];
      let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      const f = (d - 90) * 0.025;
      a.x += dx / d * f; a.y += dy / d * f; a.z += dz / d * f;
      b.x -= dx / d * f; b.y -= dy / d * f; b.z -= dz / d * f;
    }
    for (const p of pts) {
      const c = centers[p.n.type] || { x: 0, y: 0, z: 0 };
      p.x += (c.x - p.x) * 0.008;
      p.y += (c.y - p.y) * 0.008;
      p.z += (c.z - p.z) * 0.008;
      p.x *= 0.997; p.y *= 0.997; p.z *= 0.997;
    }
  }

  nodes = pts;
  adjacency = {};
  for (const l of graph.links) {
    (adjacency[l.src] = adjacency[l.src] || new Set()).add(l.dst);
    (adjacency[l.dst] = adjacency[l.dst] || new Set()).add(l.src);
  }

  particles = [];
  const links = graph.links;
  const cap = Math.min(110, links.length);
  for (let i = 0; i < cap; i++) {
    particles.push({ e: links[i], t: Math.random(), sp: 0.0035 + Math.random() * 0.005 });
  }
  fitToView();
}

function project(p, w, h) {
  const px = p.x - pivot.x, py = p.y - pivot.y, pz = p.z - pivot.z;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cx = Math.cos(pitch), sx = Math.sin(pitch);
  let x = px * cy - pz * sy;
  let z = px * sy + pz * cy;
  let y = py * cx - z * sx;
  z = py * sx + z * cx;
  const depth = CAM + z;
  const s = (FOCAL / Math.max(1, depth)) * zoom;
  return { X: w / 2 + x * s + panX, Y: h / 2 + y * s + panY, s, z, depth };
}

function fitToView() {
  if (!nodes.length) return;
  panX = 0; panY = 0;
  const w = cv.clientWidth, h = cv.clientHeight;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of nodes) {
    const q = project(p, w, h);
    minX = Math.min(minX, q.X); maxX = Math.max(maxX, q.X);
    minY = Math.min(minY, q.Y); maxY = Math.max(maxY, q.Y);
  }
  const k = Math.min((w * 0.78) / Math.max(1, maxX - minX), (h * 0.78) / Math.max(1, maxY - minY));
  zoom = Math.max(0.3, Math.min(3, zoom * k));
  dirty = true;
}

function matches(n) {
  if (longOnly && n.tier !== 'long') return false;
  if (filterType && n.type !== filterType) return false;
  if (filterText && !(n.text || '').toLowerCase().includes(filterText)) return false;
  return true;
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);

      const a = pos[l.src], b = pos[l.dst];
      if (!a || !b) continue;
      const related = focusId && (l.src === focusId || l.dst === focusId);
      if (!showEdges && !related) continue;
      const x = a.X + (b.X - a.X) * pt.t;
      const y = a.Y + (b.Y - a.Y) * pt.t;
      const alpha = 0.5 + 0.4 * Math.sin(now / 300 + pt.t * 6);
      ctx.fillStyle = `rgba(175,225,255,${alpha.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(130,200,255,0.15)`;
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 节点 + 呼吸光
  const order = shown.map(p => ({ p, q: pos[p.n.id] }));
  order.sort((A, B) => A.q.z - B.q.z);
  for (const { p, q } of order) {
    const n = p.n;
    const inFocus = !hasFocus || focusSet.has(n.id);
    const dim = hasFocus && !inFocus;
    const r = Math.max(1.6, (2 + 4.2 * Math.min(1, n.importance || 0.5)) * q.s);
    const col = TYPE_COLORS[n.type] || '#8fb0d0';
    const isSel = selected === n.id || hoverId === n.id;
    const breathe = 0.5 + 0.5 * Math.sin(now / 900 + n.id * 0.7);

    if (!dim) {
      ctx.fillStyle = hexA(col, (isSel ? 0.12 : 0.045) + 0.025 * breathe);
      ctx.beginPath(); ctx.arc(q.X, q.Y, r * (isSel ? 3.2 : 2.2 + 0.25 * breathe), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hexA(col, 0.07 + 0.04 * breathe);
      ctx.beginPath(); ctx.arc(q.X, q.Y, r * 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = dim ? 0.22 : 1;
    ctx.beginPath(); ctx.arc(q.X, q.Y, r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 1;

    if (n.tier === 'long') {
      ctx.beginPath(); ctx.arc(q.X, q.Y, r + 2, 0, Math.PI * 2);
      ctx.strokeStyle = dim ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.4)';
      ctx.stroke();
    }
    if (isSel) {
      ctx.beginPath(); ctx.arc(q.X, q.Y, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#eaf6ff'; ctx.stroke();
    }
  }

  // 焦点标签
  if (hasFocus) {
    for (const p of shown) {
      if (!focusSet.has(p.n.id)) continue;
      const q = pos[p.n.id];
      const label = (p.n.text || '').slice(0, 22);
      ctx.font = '10px system-ui';
      ctx.fillStyle = p.n.id === focusId ? 'rgba(235,248,255,0.95)' : 'rgba(190,220,255,0.75)';
      ctx.fillText(label, q.X + 8, q.Y - 6);
    }
  }
  lastPos = order.map(o => ({ ...o.q, n: o.p.n }));
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - (lastT || now));
  lastT = now;
  if (anim) {
    for (const pt of particles) {
      pt.t += pt.sp * dt / 16;
      if (pt.t > 1) pt.t -= 1;
    }
    dirty = true;
  }
  if (autoOrbit && !dragging) {
    yaw += 0.0006 * dt;
    dirty = true;
  }
  if (dirty && now - lastDraw > 33) {
    lastDraw = now;
    dirty = false;
    draw(now);
  }
}

function drawChart() {
  const n = +document.getElementById('rn').value;
  const tauDays = +document.getElementById('rt').value;
  document.getElementById('vn').textContent = n;
  document.getElementById('vt').textContent = tauDays;
  const c = document.getElementById('chart');
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const x0 = 34, x1 = W - 8, y0 = H - 20, y1 = 12;
  const logMin = Math.log10(60), logMax = Math.log10(525600);
  const x = t => x0 + (x1 - x0) * (Math.log10(t) - logMin) / (logMax - logMin);
  const y = v => y0 - (y0 - y1) * v;

  g.strokeStyle = 'rgba(120,180,255,0.18)';
  g.beginPath(); g.moveTo(x0, y1); g.lineTo(x0, y0); g.lineTo(x1, y0); g.stroke();
  g.fillStyle = '#5f7d9a'; g.font = '10px system-ui';
  g.fillText('保持率', 2, y1 + 4);
  for (const [label, t] of [['1h', 60], ['1d', 1440], ['7d', 10080], ['30d', 43200], ['90d', 129600], ['1y', 525600]]) {
    g.fillText(label, x(t) - 8, H - 6);
    g.strokeStyle = 'rgba(120,180,255,0.08)';
    g.beginPath(); g.moveTo(x(t), y1); g.lineTo(x(t), y0); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.beginPath(); g.moveTo(x0, y(0.5)); g.lineTo(x1, y(0.5)); g.stroke();
  g.fillText('50%', 2, y(0.5) + 3);

  function curve(fn, color, width) {
    g.beginPath();
    for (let i = 0; i <= 140; i++) {
      const t = 60 * Math.pow(525600 / 60, i / 140);
      const v = Math.max(0, Math.min(1, fn(t)));
      const px = x(t), py = y(v);
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.strokeStyle = color; g.lineWidth = width; g.stroke();
  }
  curve(t => Math.exp(-t / (1.2 * 1440)), '#ff6b6b', 1.5);
  curve(t => Math.exp(-t / (tauDays * 1440)), '#5aa9ff', 1.5);
  curve(t => Math.exp(-t / (tauDays * 1440 * (1 + 0.5 * n))), '#4dd0a0', 1.8);
}

function updatePanel() {
  if (!graph) return;
  const s = graph.stats;
  const shown = nodes.filter(p => matches(p.n)).length;
  document.getElementById('stats').innerHTML =
    `显示 ${shown} / 活跃 ${s.active} · 归档 ${s.archived} · 被取代 ${s.superseded} · 链接 ${s.links}<br>` +
    `短期层 ${s.tiers.short} · 长期层 ${s.tiers.long}`;
  const card = document.getElementById('card');
  if (selected) {
    const n = graph.notes.find(x => x.id === selected);
    if (n) {
      card.classList.remove('hidden');
      document.getElementById('cTitle').textContent = `#${n.id} · ${n.type} · ${n.tier === 'long' ? '长期层' : '短期层'}`;
      document.getElementById('cText').textContent = n.text;
      document.getElementById('cMeta').textContent =
        `重要度 ${n.importance} · 有效复述 ${n.n_eff} · ${n.archived ? '已归档' : (n.superseded_by ? '已被取代' : '活跃')}`;
    }
  } else {
    card.classList.add('hidden');
  }
}

function pick(e) {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bestD = 15;
  for (const p of lastPos) {
    const d = Math.hypot(p.X - x, p.Y - y);
    if (d < bestD) { bestD = d; best = p.n.id; }
  }
  selected = best;
  dirty = true;
  updatePanel();
}

cv.addEventListener('mousedown', e => {
  dragging = true;
  panning = e.button === 2 || e.shiftKey;
  moved = 0; lx = e.clientX; ly = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) {
    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let best = null, bestD = 14;
    for (const p of lastPos) {
      const d = Math.hypot(p.X - x, p.Y - y);
      if (d < bestD) { bestD = d; best = p.n.id; }
    }
    if (best !== hoverId) { hoverId = best; dirty = true; }
    return;
  }
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (panning) {
    panX += dx; panY += dy;
  } else {
    yaw += dx * 0.008;
    pitch = Math.max(-1.3, Math.min(1.3, pitch + dy * 0.006));
  }
  dirty = true;
});
window.addEventListener('mouseup', e => {
  if (dragging && moved < 5 && !panning) pick(e);
  dragging = false;
  panning = false;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('dblclick', e => {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bestD = 15;
  for (const p of lastPos) {
    const d = Math.hypot(p.X - x, p.Y - y);
    if (d < bestD) { bestD = d; best = p.n.id; }
  }
  if (best) {
    const n = nodes.find(p => p.n.id === best);
    if (n) {
      pivot = { x: n.x, y: n.y, z: n.z };
      panX = 0; panY = 0;
      dirty = true;
    }
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3.5, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  dirty = true;
}, { passive: false });

document.getElementById('q').addEventListener('input', e => {
  filterText = e.target.value.trim().toLowerCase();
  dirty = true; updatePanel();
});
document.getElementById('ftype').addEventListener('change', e => {
  filterType = e.target.value;
  dirty = true; updatePanel();
});
document.getElementById('flong').addEventListener('change', e => {
  longOnly = e.target.checked;
  dirty = true; updatePanel();
});
document.getElementById('fedge') && document.getElementById('fedge').addEventListener('change', e => {
  showEdges = e.target.checked;
  dirty = true;
});
document.getElementById('re').addEventListener('input', e => {
  const v = +e.target.value;
  document.getElementById('ev').textContent = v + '%';
  edgeAlpha = Math.max(0.03, 1 - v / 100);
  dirty = true;
});
document.getElementById('fanim').addEventListener('change', e => {
  anim = e.target.checked;
  dirty = true;
});
document.getElementById('orbit').addEventListener('click', e => {
  autoOrbit = !autoOrbit;
  e.target.textContent = autoOrbit ? '暂停自转' : '开始自转';
  dirty = true;
});
document.getElementById('fit').addEventListener('click', fitToView);
document.getElementById('reset').addEventListener('click', () => {
  yaw = 0.6; pitch = 0.22; zoom = 1;
  panX = 0; panY = 0; pivot = { x: 0, y: 0, z: 0 };
  selected = null; hoverId = null;
  dirty = true; updatePanel();
});
document.getElementById('rn').addEventListener('input', drawChart);
document.getElementById('rt').addEventListener('input', drawChart);

function applyGraph(g) {
  graph = g;
  buildLayout();
  const sel = document.getElementById('ftype');
  const types = [...new Set(g.notes.map(n => n.type))].sort();
  sel.innerHTML = '<option value="">全部类型</option>' +
    types.map(t => `<option value="${t}"${t === filterType ? ' selected' : ''}>${t}</option>`).join('');
  dirty = true;
  updatePanel();
}

function refresh() {
  if (window.__GRAPH__) { applyGraph(window.__GRAPH__); return; }
  fetch('/api/graph').then(r => r.json()).then(applyGraph).catch(() => {});
}

drawChart();
refresh();
setInterval(refresh, 30000);
requestAnimationFrame(frame);
</script>
</body>
</html>
