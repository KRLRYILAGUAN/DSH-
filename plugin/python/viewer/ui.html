<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>记忆星图 · 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060c; color: #cfe3ff;
               font: 14px/1.5 "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cv:active { cursor: grabbing; }
  #panel { position: fixed; top: 16px; right: 16px; width: 330px; max-height: calc(100% - 32px);
           overflow-y: auto; background: rgba(6, 12, 22, 0.86); border: 1px solid rgba(90,169,255,0.22);
           border-radius: 12px; padding: 14px; backdrop-filter: blur(8px);
           transition: transform .18s ease; z-index: 10; }
  #panel.collapsed { transform: translateX(calc(100% + 16px)); }
  #panelToggle { position: absolute; left: -15px; top: 14px; width: 24px; height: 56px; padding: 0;
                 border-radius: 8px 0 0 8px; font-size: 14px; line-height: 1;
                 background: rgba(15,39,64,0.92); z-index: 12; }
  #panelTab { position: fixed; right: 0; top: 50%; transform: translateY(-50%);
              display: none; padding: 10px 5px; border-radius: 8px 0 0 8px;
              writing-mode: vertical-rl; letter-spacing: 2px; font-size: 12px;
              background: rgba(15,39,64,0.92); z-index: 12; }
  #panelTab.show { display: block; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #9fd0ff; }
  .stat { font-size: 12px; color: #8fb0d0; margin: 2px 0; }
  .card { border-top: 1px dashed rgba(90,169,255,0.18); margin-top: 10px; padding-top: 10px; }
  #chart { width: 100%; height: 150px; background: rgba(4,7,12,0.7); border-radius: 8px; }
  .legend { font-size: 11px; color: #7f9dbb; margin-top: 4px; }
  .legend span { margin-right: 10px; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row label { font-size: 11px; color: #8fb0d0; }
  .mode.on { background: #1d4d7a; border-color: #5aa9ff; color: #eaf6ff; }
  input[type=text] { flex: 1; min-width: 120px; background: #0a1626; color: #cfe3ff;
                     border: 1px solid #244a73; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  select { background: #0a1626; color: #cfe3ff; border: 1px solid #244a73; border-radius: 6px;
           padding: 4px 6px; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: #5aa9ff; }
  .val { font-size: 11px; color: #9fd0ff; }
  button { background: #0f2740; color: #cfe3ff; border: 1px solid #2c5d8f; border-radius: 6px;
           padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button:hover { background: #173a5e; }
  #card { border-top: 1px solid rgba(90,169,255,0.18); margin-top: 10px; padding-top: 8px; }
  #card.hidden { display: none; }
  #card h2 { font-size: 13px; margin: 0 0 6px; }
  #cText { font-size: 12px; color: #9fc3e8; word-break: break-all; }
  #cMeta { font-size: 11px; color: #7f9dbb; }
  .hint { font-size: 11px; color: #5f7d9a; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<aside id="panel">
  <button id="panelToggle" title="收起面板">›</button>
  <h1>记忆星图 · 3D</h1>
  <div id="stats" class="stat">加载中…</div>
  <div id="regions" class="legend"></div>

  <div class="row">
    <input id="q" type="text" placeholder="搜索记忆…">
    <select id="ftype"><option value="">全部类型</option></select>
  </div>
  <div class="row">
    <label><input id="flong" type="checkbox"> 只看长期层</label>
    <label><input id="fforget" type="checkbox" checked> 显示遗忘区</label>
    <label><input id="fchat" type="checkbox" checked> 显示闲聊</label>
    <label><input id="fanim" type="checkbox" checked> 动效</label>
  </div>
  <div class="row">
    <button id="mNebula" class="mode on" type="button">星云</button>
    <button id="mBrain" class="mode" type="button">脑图</button>
  </div>
  <div class="row">
    <label>连线透明度 <span id="ev" class="val">70%</span></label>
  </div>
  <input id="re" type="range" min="0" max="100" value="70">
  <div class="row">
    <button id="orbit">开始自转</button>
    <button id="fit">适应视角</button>
    <button id="reset">重置</button>
  </div>

  <div id="card" class="hidden">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <p id="cMeta"></p>
    <p id="cTime" class="stat"></p>
    <canvas id="cCurve" width="300" height="96" style="width:100%;height:96px;margin-top:6px"></canvas>
    <p id="cCurveInfo" class="stat"></p>
  </div>

  <div id="evcard" class="card">
    <div style="font-size:13px;color:#9fd0ff;margin-bottom:4px">遗忘 / 取代记录</div>
    <div id="events" class="stat">加载中…</div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:#9fd0ff;margin-bottom:4px">艾宾浩斯遗忘曲线</div>
    <canvas id="chart" width="300" height="150"></canvas>
    <div class="row"><label>复述 n=<span id="vn" class="val">0</span></label></div>
    <input id="rn" type="range" min="0" max="20" value="0">
    <div class="row"><label>长期层 τ=<span id="vt" class="val">90</span> 天</label></div>
    <input id="rt" type="range" min="7" max="365" value="90">
    <div class="legend">
      <span><span class="swatch" style="background:#ff6b6b"></span>艾宾浩斯</span>
      <span><span class="swatch" style="background:#5aa9ff"></span>本模型 n=0</span>
      <span><span class="swatch" style="background:#4dd0a0"></span>本模型 n&gt;0</span>
    </div>
  </div>
  <p class="hint">拖拽旋转 · 右键/Shift 拖拽平移 · 双击节点设为中心 · 滚轮缩放 · 点击聚焦</p>
</aside>
<button id="panelTab" title="展开面板">星图 ›</button>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let graph = null;
let nodes = [];
let adjacency = {};
let particles = [];
const dust = Array.from({ length: 80 }, () => ({
  x: Math.random(), y: Math.random(),
  r: 0.4 + Math.random() * 1.4,
  p: Math.random() * Math.PI * 2,
  s: 0.2 + Math.random() * 0.6,
}));
let selected = null;
let hoverId = null;
let yaw = 0.6, pitch = 0.22, zoom = 1;
let panX = 0, panY = 0;
let pivot = { x: 0, y: 0, z: 0 };
let dragging = false, panning = false, lx = 0, ly = 0, moved = 0;
let showEdges = false;
let edgeAlpha = 0.3;
let longOnly = false;
let showForgotten = true;
let showChat = true;
let viewMode = 'nebula';
let filterText = '';
let filterType = '';
let anim = true;
let autoOrbit = false;
let dirty = true;
let lastDraw = 0;
let lastT = 0;
let lastPos = [];
const DPR = Math.min(2, window.devicePixelRatio || 1);
const bgCanvas = document.createElement('canvas');
const CAM = 1000, FOCAL = 1150, R = 340;

const TYPE_COLORS = {
  fact: '#5aa9ff', preference: '#ffd166', decision: '#4dd0a0',
  project: '#b78bff', concept: '#ff9f6b', event: '#7fd6d6',
  todo: '#ff6b9a', utterance: '#8fb0d0', skill: '#c0c0c0'
};

const REGIONS = [
  { key: 'hippocampus', label: '海马体 · 情景记忆', color: '#5aa9ff', pos: { x: -0.62, y: 0.05, z: 0.05 } },
  { key: 'emotion', label: '情感区 · 偏好', color: '#ffd166', pos: { x: 0.05, y: 0.62, z: 0.12 } },
  { key: 'executive', label: '前额叶 · 决策计划', color: '#4dd0a0', pos: { x: 0.62, y: 0.05, z: -0.10 } },
  { key: 'semantic', label: '语义区 · 概念技能', color: '#ff9f6b', pos: { x: 0.00, y: -0.55, z: 0.35 } },
  { key: 'deep', label: '深层记忆区', color: '#b78bff', pos: { x: 0.00, y: 0.00, z: -0.80 } },
  { key: 'chatter', label: '闲聊流 · 快衰减', color: '#8ea0b8', pos: { x: 0.62, y: -0.55, z: 0.35 } },
  { key: 'forgotten', label: '遗忘区 · 归档/取代', color: '#ff6b6b', pos: { x: 0.00, y: -0.85, z: -0.30 } },
];

const BRAIN_POS = {
  hippocampus: { x: -0.38, y: -0.30, z: 0.10 },
  emotion: { x: 0.02, y: -0.18, z: 0.18 },
  executive: { x: 0.55, y: 0.12, z: 0.05 },
  semantic: { x: -0.52, y: 0.08, z: 0.18 },
  deep: { x: -0.05, y: 0.02, z: -0.45 },
  chatter: { x: 0.62, y: -0.32, z: 0.30 },
  forgotten: { x: 0.05, y: -0.70, z: -0.30 },
};

function regionCenter(r) {
  const p = viewMode === 'brain' && BRAIN_POS[r.key] ? BRAIN_POS[r.key] : r.pos;
  return { x: p.x * R, y: p.y * R, z: p.z * R };
}

function regionOf(n) {
  if (n.archived || n.superseded_by !== null) return 'forgotten';
  if (n.type === 'chat') return 'chatter';
  if (n.tier === 'long') return 'deep';
  if (n.type === 'preference') return 'emotion';
  if (n.type === 'decision' || n.type === 'project') return 'executive';
  if (n.type === 'concept' || n.type === 'skill') return 'semantic';
  return 'hippocampus';
}

function resize() {
  cv.width = cv.clientWidth * DPR;
  cv.height = cv.clientHeight * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildNebula(cv.clientWidth, cv.clientHeight);
  dirty = true;
}
window.addEventListener('resize', resize);
resize();

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildNebula(w, h) {
  bgCanvas.width = w * DPR;
  bgCanvas.height = h * DPR;
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 深蓝底：上浅下深，避免纯黑死板
  const base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#070d18');
  base.addColorStop(0.55, '#040811');
  base.addColorStop(1, '#02040a');
  g.fillStyle = base;
  g.fillRect(0, 0, w, h);

  const rng = mulberry32(20261031);
  const blobs = [
    [0.25, 0.35, 0.45, 'rgba(46,84,150,0.10)'],
    [0.72, 0.28, 0.38, 'rgba(92,70,160,0.07)'],
    [0.55, 0.70, 0.50, 'rgba(36,104,140,0.07)'],
  ];
  for (const [fx, fy, fr, color] of blobs) {
    const grd = g.createRadialGradient(w * fx, h * fy, 0, w * fx, h * fy, Math.max(w, h) * fr);
    grd.addColorStop(0, color);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, w, h);
  }

  // 星点尺寸保持原样
  for (let i = 0; i < 420; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 0.3 + rng() * 1.6;
    const a = 0.12 + rng() * 0.55;
    const tint = rng();
    g.fillStyle = tint > 0.8 ? `rgba(170,200,255,${a})` : (tint > 0.5 ? `rgba(220,230,255,${a})` : `rgba(140,170,230,${a})`);
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // 四角压暗，让前景节点更干净
  const vig = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vig;
  g.fillRect(0, 0, w, h);
}

function norm(v) {
  const n = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1;
  return { x: v.x / n, y: v.y / n, z: v.z / n };
}

function buildLayout() {
  const active = graph.notes.filter(n =>
    (!showChat && n.type === 'chat')
      ? false
      : ((!n.archived && n.superseded_by === null) ||
         (showForgotten && (n.archived || n.superseded_by !== null)))
  );
  const centers = {};
  for (const r of REGIONS) {
    centers[r.key] = regionCenter(r);
  }
  const rng = mulberry32(42);
  const pts = active.map(n => {
    const reg = n.region || regionOf(n);
    const c = centers[reg];
    return {
      n, reg,
      x: c.x + (rng() - 0.5) * 110,
      y: c.y + (rng() - 0.5) * 110,
      z: c.z + (rng() - 0.5) * 110
    };
  });
  const idx = {};
  pts.forEach((p, i) => { idx[p.n.id] = i; });

  for (let it = 0; it < 130; it++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j];
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        let d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < 1) d2 = 1;
        if (d2 > 190 * 190) continue;
        const f = 900 / d2;
        const d = Math.sqrt(d2);
        a.x -= dx / d * f; a.y -= dy / d * f; a.z -= dz / d * f;
        b.x += dx / d * f; b.y += dy / d * f; b.z += dz / d * f;
      }
    }
    for (const l of graph.links) {
      if (l.valid_to) continue;
      const ia = idx[l.src], ib = idx[l.dst];
      if (ia === undefined || ib === undefined) continue;
      const a = pts[ia], b = pts[ib];
      let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      const f = (d - 90) * 0.025;
      a.x += dx / d * f; a.y += dy / d * f; a.z += dz / d * f;
      b.x -= dx / d * f; b.y -= dy / d * f; b.z -= dz / d * f;
    }
    for (const p of pts) {
      const c = centers[p.reg] || { x: 0, y: 0, z: 0 };
      p.x += (c.x - p.x) * 0.008;
      p.y += (c.y - p.y) * 0.008;
      p.z += (c.z - p.z) * 0.008;
      p.x *= 0.997; p.y *= 0.997; p.z *= 0.997;
    }
  }

  nodes = pts;
  adjacency = {};
  for (const l of graph.links) {
    if (l.valid_to) continue;
    (adjacency[l.src] = adjacency[l.src] || new Set()).add(l.dst);
    (adjacency[l.dst] = adjacency[l.dst] || new Set()).add(l.src);
  }

  particles = [];
  const links = graph.links.filter(l => !l.valid_to);
  const cap = Math.min(110, links.length);
  for (let i = 0; i < cap; i++) {
    particles.push({ e: links[i], t: Math.random(), sp: 0.0035 + Math.random() * 0.005 });
  }
  fitToView();
}

function project(p, w, h) {
  const px = p.x - pivot.x, py = p.y - pivot.y, pz = p.z - pivot.z;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cx = Math.cos(pitch), sx = Math.sin(pitch);
  let x = px * cy - pz * sy;
  let z = px * sy + pz * cy;
  let y = py * cx - z * sx;
  z = py * sx + z * cx;
  const depth = CAM + z;
  const s = (FOCAL / Math.max(1, depth)) * zoom;
  return { X: w / 2 + x * s + panX, Y: h / 2 + y * s + panY, s, z, depth };
}

function fitToView() {
  if (!nodes.length) return;
  panX = 0; panY = 0;
  const w = cv.clientWidth, h = cv.clientHeight;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of nodes) {
    const q = project(p, w, h);
    minX = Math.min(minX, q.X); maxX = Math.max(maxX, q.X);
    minY = Math.min(minY, q.Y); maxY = Math.max(maxY, q.Y);
  }
  const k = Math.min((w * 0.78) / Math.max(1, maxX - minX), (h * 0.78) / Math.max(1, maxY - minY));
  zoom = Math.max(0.3, Math.min(3, zoom * k));
  dirty = true;
}

function matches(n) {
  if (!showChat && n.type === 'chat') return false;
  if (!showForgotten && (n.archived || n.superseded_by !== null)) return false;
  if (longOnly && n.tier !== 'long') return false;
  if (filterType && n.type !== filterType) return false;
  if (filterText && !(n.text || '').toLowerCase().includes(filterText)) return false;
  return true;
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function fmtTime(s) {
  if (!s) return '—';
  return String(s).replace('T', ' ').slice(0, 16);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function draw(now) {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(bgCanvas, 0, 0, w, h);
  if (!graph) return;

  if (viewMode === 'nebula') {
    for (const d of dust) {
      const x = (d.x * w + now * 0.004 * d.s) % w;
      const y = d.y * h + Math.sin(now * 0.0005 + d.p) * 6;
      const a = 0.06 + 0.12 * (0.5 + 0.5 * Math.sin(now * 0.001 + d.p));
      ctx.fillStyle = `rgba(190,215,255,${a.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 脑区：淡淡的光晕 + 名称/计数
  const regionCounts = {};
  for (const p of nodes) regionCounts[p.reg] = (regionCounts[p.reg] || 0) + 1;
  for (const r of REGIONS) {
    const q = project(regionCenter(r), w, h);
    const rad = Math.max(24, 0.30 * R * q.s);
    if (viewMode === 'nebula') {
      const cloud = ctx.createRadialGradient(q.X, q.Y, 0, q.X, q.Y, rad * 1.6);
      cloud.addColorStop(0, hexA(r.color, 0.13));
      cloud.addColorStop(0.55, hexA(r.color, 0.05));
      cloud.addColorStop(1, hexA(r.color, 0));
      ctx.fillStyle = cloud;
      ctx.beginPath(); ctx.arc(q.X, q.Y, rad * 1.6, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = hexA(r.color, 0.035);
      ctx.beginPath(); ctx.arc(q.X, q.Y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([4, 7]);
      ctx.strokeStyle = hexA(r.color, 0.18);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q.X, q.Y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.font = '11px system-ui';
    ctx.fillStyle = hexA(r.color, viewMode === 'nebula' ? 0.85 : 0.72);
    ctx.fillText(`${r.label} ${regionCounts[r.key] || 0}`, q.X - rad * 0.9, q.Y - rad - 7);
  }

  const shown = nodes.filter(p => matches(p.n));
  const regOf = {};
  for (const p of nodes) regOf[p.n.id] = p.reg;
  const regColor = key => (REGIONS.find(r => r.key === key) || {}).color || '#8fb0d0';
  const shownIds = new Set(shown.map(p => p.n.id));
  const focusId = selected || hoverId;
  const focusSet = new Set();
  if (focusId) {
    focusSet.add(focusId);
    for (const nb of (adjacency[focusId] || [])) {
      if (shownIds.has(nb)) focusSet.add(nb);
    }
  }
  const hasFocus = focusSet.size > 0;

  const pos = {};
  for (const p of shown) pos[p.n.id] = project(p, w, h);
  // 轻微浮动：只动屏幕坐标，不扰动布局
  for (const p of shown) {
    const q = pos[p.n.id];
    if (!q) continue;
    q.X += Math.sin(now / 1600 + p.n.id * 1.9) * 3;
    q.Y += Math.cos(now / 1900 + p.n.id * 1.3) * 2.5;
  }

  // 连线 + 粒子流
  for (const l of graph.links) {
    if (l.valid_to) continue;
    const a = pos[l.src], b = pos[l.dst];
    if (!a || !b) continue;
    const related = focusId && (l.src === focusId || l.dst === focusId);
    const fog = Math.max(0.35, Math.min(1, 1 - ((a.z + b.z) / 2 / R) * 0.35));
    let alpha = related ? Math.min(0.9, edgeAlpha + 0.35) : edgeAlpha;
    if (hasFocus && !related) alpha *= 0.2;
    alpha *= fog;
    if (viewMode === 'nebula') {
      const grad = ctx.createLinearGradient(a.X, a.Y, b.X, b.Y);
      grad.addColorStop(0, hexA(regColor(regOf[l.src]), alpha));
      grad.addColorStop(1, hexA(regColor(regOf[l.dst]), alpha));
      ctx.strokeStyle = grad;
    } else {
      ctx.strokeStyle = `rgba(130,200,255,${alpha.toFixed(3)})`;
    }
    ctx.lineWidth = related ? 1.5 : 0.7;
    ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();
  }

  // 中心核心
  const core = project({ x: 0, y: 0, z: 0 }, w, h);
  const top = shown.slice().sort((a, b) => (b.n.importance || 0) - (a.n.importance || 0)).slice(0, 8);
  for (const p of top) {
    const q = pos[p.n.id];
    if (!q) continue;
    ctx.strokeStyle = 'rgba(150,210,255,0.10)';
    ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(core.X, core.Y); ctx.lineTo(q.X, q.Y); ctx.stroke();
  }
  const corePulse = 0.5 + 0.5 * Math.sin(now / 1200);
  ctx.fillStyle = `rgba(140,200,255,${0.08 + 0.05 * corePulse})`;
  ctx.beginPath(); ctx.arc(core.X, core.Y, 20 * core.s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(190,230,255,0.22)';
  ctx.beginPath(); ctx.arc(core.X, core.Y, 8 * core.s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(225,242,255,0.9)';
  ctx.beginPath(); ctx.arc(core.X, core.Y, 3.5 * core.s, 0, Math.PI * 2); ctx.fill();
  ctx.font = '10px system-ui';
  ctx.fillStyle = 'rgba(200,230,255,0.8)';
  ctx.fillText('核心', core.X + 9, core.Y + 3);

  if (anim) {
    for (const pt of particles) {
      const l = pt.e;
      const a = pos[l.src], b = pos[l.dst];
      if (!a || !b) continue;
      const related = focusId && (l.src === focusId || l.dst === focusId);
      if (!showEdges && !related) continue;
      const x = a.X + (b.X - a.X) * pt.t;
      const y = a.Y + (b.Y - a.Y) * pt.t;
      const alpha = 0.5 + 0.4 * Math.sin(now / 300 + pt.t * 6);
      ctx.fillStyle = `rgba(175,225,255,${alpha.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(130,200,255,0.15)`;
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 节点 + 呼吸光
  const order = shown.map(p => ({ p, q: pos[p.n.id] }));
  order.sort((A, B) => A.q.z - B.q.z);
  for (const { p, q } of order) {
    const n = p.n;
    const inFocus = !hasFocus || focusSet.has(n.id);
    const dim = hasFocus && !inFocus;
    const r = Math.max(1.2, (2 + 4.2 * Math.min(1, n.importance || 0.5)) * q.s * 0.75);
    const region = REGIONS.find(r => r.key === p.reg);
    const col = region ? region.color : (TYPE_COLORS[n.type] || '#8fb0d0');
    const isSel = selected === n.id || hoverId === n.id;
    const breathe = 0.5 + 0.5 * Math.sin(now / 900 + n.id * 0.7);

    if (!dim) {
      const outer = Math.max(3, r * (isSel ? 6.0 : 4.2 + 0.5 * breathe));
      const halo = ctx.createRadialGradient(q.X, q.Y, r * 0.15, q.X, q.Y, outer);
      halo.addColorStop(0, hexA(col, (isSel ? 0.20 : 0.13) + 0.04 * breathe));
      halo.addColorStop(0.28, hexA(col, 0.055));
      halo.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(q.X, q.Y, outer, 0, Math.PI * 2); ctx.fill();

      const inner = Math.max(2, r * 1.9);
      const core = ctx.createRadialGradient(q.X, q.Y, 0, q.X, q.Y, inner);
      core.addColorStop(0, hexA(col, 0.22 + 0.05 * breathe));
      core.addColorStop(0.55, hexA(col, 0.07));
      core.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(q.X, q.Y, inner, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = hexA(col, 0.10 + 0.05 * breathe);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q.X, q.Y, r * 2.15, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = dim ? 0.22 : 1;
    ctx.beginPath(); ctx.arc(q.X, q.Y, r, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = TYPE_COLORS[n.type] || '#cfe3ff';
    ctx.beginPath(); ctx.arc(q.X, q.Y, Math.max(0.8, r * 0.35), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    if (n.tier === 'long') {
      ctx.beginPath(); ctx.arc(q.X, q.Y, r + 2, 0, Math.PI * 2);
      ctx.strokeStyle = dim ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.4)';
      ctx.stroke();
    }
    if (n.pinned) {
      ctx.save();
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.arc(q.X, q.Y, r * 1.65, 0, Math.PI * 2);
      ctx.strokeStyle = dim ? 'rgba(255,209,102,0.2)' : 'rgba(255,209,102,0.85)';
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.restore();
    }
    if (isSel) {
      ctx.beginPath(); ctx.arc(q.X, q.Y, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#eaf6ff'; ctx.stroke();
    }
  }

  // 焦点标签
  if (hasFocus) {
    for (const p of shown) {
      if (!focusSet.has(p.n.id)) continue;
      const q = pos[p.n.id];
      const label = (p.n.text || '').slice(0, 22);
      ctx.font = '10px system-ui';
      ctx.fillStyle = p.n.id === focusId ? 'rgba(235,248,255,0.95)' : 'rgba(190,220,255,0.75)';
      ctx.fillText(label, q.X + 8, q.Y - 6);
    }
  }
  lastPos = order.map(o => ({ ...o.q, n: o.p.n }));
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - (lastT || now));
  lastT = now;
  if (anim) {
    for (const pt of particles) {
      pt.t += pt.sp * dt / 16;
      if (pt.t > 1) pt.t -= 1;
    }
    dirty = true;
  }
  if (autoOrbit && !dragging) {
    yaw += 0.0006 * dt;
    dirty = true;
  }
  if (dirty && now - lastDraw > 33) {
    lastDraw = now;
    dirty = false;
    draw(now);
  }
}

function drawChart() {
  const n = +document.getElementById('rn').value;
  const tauDays = +document.getElementById('rt').value;
  document.getElementById('vn').textContent = n;
  document.getElementById('vt').textContent = tauDays;
  const c = document.getElementById('chart');
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const x0 = 34, x1 = W - 8, y0 = H - 20, y1 = 12;
  const logMin = Math.log10(60), logMax = Math.log10(525600);
  const x = t => x0 + (x1 - x0) * (Math.log10(t) - logMin) / (logMax - logMin);
  const y = v => y0 - (y0 - y1) * v;

  g.strokeStyle = 'rgba(120,180,255,0.18)';
  g.beginPath(); g.moveTo(x0, y1); g.lineTo(x0, y0); g.lineTo(x1, y0); g.stroke();
  g.fillStyle = '#5f7d9a'; g.font = '10px system-ui';
  g.fillText('保持率', 2, y1 + 4);
  for (const [label, t] of [['1h', 60], ['1d', 1440], ['7d', 10080], ['30d', 43200], ['90d', 129600], ['1y', 525600]]) {
    g.fillText(label, x(t) - 8, H - 6);
    g.strokeStyle = 'rgba(120,180,255,0.08)';
    g.beginPath(); g.moveTo(x(t), y1); g.lineTo(x(t), y0); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.beginPath(); g.moveTo(x0, y(0.5)); g.lineTo(x1, y(0.5)); g.stroke();
  g.fillText('50%', 2, y(0.5) + 3);

  function curve(fn, color, width) {
    g.beginPath();
    for (let i = 0; i <= 140; i++) {
      const t = 60 * Math.pow(525600 / 60, i / 140);
      const v = Math.max(0, Math.min(1, fn(t)));
      const px = x(t), py = y(v);
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.strokeStyle = color; g.lineWidth = width; g.stroke();
  }
  curve(t => Math.exp(-t / (1.2 * 1440)), '#ff6b6b', 1.5);
  curve(t => Math.exp(-t / (tauDays * 1440)), '#5aa9ff', 1.5);
  curve(t => Math.exp(-t / (tauDays * 1440 * (1 + 0.5 * n))), '#4dd0a0', 1.8);
}

function updatePanel() {
  if (!graph) return;
  const s = graph.stats;
  const shown = nodes.filter(p => matches(p.n)).length;
  document.getElementById('stats').innerHTML =
    `显示 ${shown} / 活跃 ${s.active} · 归档 ${s.archived} · 被取代 ${s.superseded} · 链接 ${s.links}<br>` +
    `短期层 ${s.tiers.short} · 长期层 ${s.tiers.long}`;
  const counts = {};
  for (const n of graph.notes) {
    const k = n.region || regionOf(n);
    counts[k] = (counts[k] || 0) + 1;
  }
  document.getElementById('regions').innerHTML = REGIONS
    .map(r => `<span><i class="swatch" style="background:${r.color}"></i>${r.label} ${counts[r.key] || 0}</span>`)
    .join('');

  const evs = (graph.events || [])
    .filter(e => ['forget', 'archive', 'supersede', 'restore', 'promote', 'demote'].includes(e.kind))
    .slice(0, 30);
  document.getElementById('events').innerHTML = evs.length
    ? evs.map(e => `<div>${fmtTime(e.ts)} · ${esc(e.kind)} · #${e.note_id ?? '-'} ${esc((e.text || '').slice(0, 40))}</div>`).join('')
    : '暂无遗忘 / 取代记录';

  const card = document.getElementById('card');
  if (selected) {
    const n = graph.notes.find(x => x.id === selected);
    if (n) {
      card.classList.remove('hidden');
      const state = n.archived ? '已归档' : (n.superseded_by ? '已被取代' : '活跃');
      document.getElementById('cTitle').textContent = `#${n.id} · ${n.type} · ${n.tier === 'long' ? '长期层' : '短期层'} · ${state}`;
      document.getElementById('cText').textContent = n.text;
      document.getElementById('cMeta').textContent =
        `重要度 ${n.importance} · 有效复述 ${n.n_eff} · 访问 ${n.access_count ?? 0} 次`;
      document.getElementById('cTime').innerHTML =
        `创建 ${fmtTime(n.created_at)}<br>` +
        `更新 ${fmtTime(n.updated_at)} · 最近访问 ${fmtTime(n.last_access)}<br>` +
        `有效期 ${fmtTime(n.valid_from)} → ${n.valid_to ? fmtTime(n.valid_to) : '至今'}<br>` +
        `来源 ${n.episode_text ? esc(n.episode_text.slice(0, 120)) : '—'}`;
      drawNodeCurve(n);
    }
  } else {
    card.classList.add('hidden');
  }
}

const REGION_DECAY = { hippocampus: 1, emotion: 1.25, executive: 1.1, semantic: 1.05, deep: 1.5, chatter: 0.25, forgotten: 1 };

function drawNodeCurve(n) {
  const cv = document.getElementById('cCurve');
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const x0 = 30, x1 = W - 10, y0 = 10, y1 = H - 20;
  const region = REGIONS.find(r => r.key === n.region);
  const col = region ? region.color : '#5aa9ff';
  const info = document.getElementById('cCurveInfo');

  if (n.pinned) {
    g.strokeStyle = col; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x0, y0 + (y1 - y0) * 0.15); g.lineTo(x1, y0 + (y1 - y0) * 0.15); g.stroke();
    info.textContent = '置顶人格/身份记忆：不衰减（S=1.0）';
    return;
  }

  const imp = +n.importance || 0.5;
  const ne = +n.n_eff || 0;
  const half = n.tier === 'long' ? 365 : 90;
  const rd = REGION_DECAY[n.region] || 1;
  const tau = half * (1 + 0.5 * ne) * rd;
  const factor = 1 + 0.5 * Math.log1p(ne);
  const S0 = imp * factor;
  const last = Date.parse(n.last_access || n.updated_at || n.created_at) || Date.now();
  const idle = Math.max(0, (Date.now() - last) / 86400000);
  const S = S0 * Math.exp(-idle / tau);
  const horizon = Math.min(730, Math.max(60, tau * 1.5));
  const maxY = Math.max(0.2, S0 * 1.05);

  const px = t => x0 + (x1 - x0) * Math.min(1, t / horizon);
  const py = v => y1 - (y1 - y0) * Math.min(1.05, v / maxY);

  g.strokeStyle = 'rgba(140,170,210,0.18)'; g.lineWidth = 1;
  g.strokeRect(x0, y0, x1 - x0, y1 - y0);
  g.fillStyle = 'rgba(160,190,225,0.55)'; g.font = '9px system-ui';
  g.fillText('S', 4, y0 + 8);
  g.fillText('0', 8, y1);
  g.fillText(`${horizon.toFixed(0)} 天`, x1 - 34, H - 6);

  g.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = (horizon * i) / 60;
    const v = S0 * Math.exp(-t / tau);
    const X = px(t), Y = py(v);
    if (i === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
  }
  g.strokeStyle = col; g.lineWidth = 2; g.stroke();

  const cx = px(Math.min(idle, horizon)), cy = py(S);
  g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2);
  g.fillStyle = col; g.fill();
  g.fillStyle = 'rgba(230,240,255,0.9)'; g.font = '9px system-ui';
  g.fillText(`现在 S=${S.toFixed(2)}`, Math.min(cx + 5, x1 - 60), Math.max(y0 + 10, cy - 6));

  const hit = tau * Math.log(S0 / 0.15);
  const left = hit - idle;
  info.textContent = `τ≈${tau.toFixed(0)} 天 · 当前 S≈${S.toFixed(2)} · ` +
    (left > 0 ? `约 ${left.toFixed(0)} 天后降到 0.15` : '已低于遗忘阈值 0.15');
}

function pick(e) {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bestD = 15;
  for (const p of lastPos) {
    const d = Math.hypot(p.X - x, p.Y - y);
    if (d < bestD) { bestD = d; best = p.n.id; }
  }
  selected = best;
  dirty = true;
  updatePanel();
}

cv.addEventListener('mousedown', e => {
  dragging = true;
  panning = e.button === 2 || e.shiftKey;
  moved = 0; lx = e.clientX; ly = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) {
    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let best = null, bestD = 14;
    for (const p of lastPos) {
      const d = Math.hypot(p.X - x, p.Y - y);
      if (d < bestD) { bestD = d; best = p.n.id; }
    }
    if (best !== hoverId) { hoverId = best; dirty = true; }
    return;
  }
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (panning) {
    panX += dx; panY += dy;
  } else {
    yaw += dx * 0.008;
    pitch = Math.max(-1.3, Math.min(1.3, pitch + dy * 0.006));
  }
  dirty = true;
});
window.addEventListener('mouseup', e => {
  if (dragging && moved < 5 && !panning) pick(e);
  dragging = false;
  panning = false;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('dblclick', e => {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  let best = null, bestD = 15;
  for (const p of lastPos) {
    const d = Math.hypot(p.X - x, p.Y - y);
    if (d < bestD) { bestD = d; best = p.n.id; }
  }
  if (best) {
    const n = nodes.find(p => p.n.id === best);
    if (n) {
      pivot = { x: n.x, y: n.y, z: n.z };
      panX = 0; panY = 0;
      dirty = true;
    }
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(0.3, Math.min(3.5, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  dirty = true;
}, { passive: false });

document.getElementById('q').addEventListener('input', e => {
  filterText = e.target.value.trim().toLowerCase();
  dirty = true; updatePanel();
});
document.getElementById('ftype').addEventListener('change', e => {
  filterType = e.target.value;
  dirty = true; updatePanel();
});
document.getElementById('flong').addEventListener('change', e => {
  longOnly = e.target.checked;
  dirty = true; updatePanel();
});
document.getElementById('fforget').addEventListener('change', e => {
  showForgotten = e.target.checked;
  buildLayout();
  dirty = true; updatePanel();
});
document.getElementById('fchat').addEventListener('change', e => {
  showChat = e.target.checked;
  buildLayout();
  dirty = true; updatePanel();
});
document.getElementById('mBrain').addEventListener('click', () => {
  viewMode = 'brain';
  document.getElementById('mBrain').classList.add('on');
  document.getElementById('mNebula').classList.remove('on');
  buildLayout();
  dirty = true;
});
document.getElementById('mNebula').addEventListener('click', () => {
  viewMode = 'nebula';
  document.getElementById('mNebula').classList.add('on');
  document.getElementById('mBrain').classList.remove('on');
  buildLayout();
  dirty = true;
});
document.getElementById('fedge') && document.getElementById('fedge').addEventListener('change', e => {
  showEdges = e.target.checked;
  dirty = true;
});
document.getElementById('re').addEventListener('input', e => {
  const v = +e.target.value;
  document.getElementById('ev').textContent = v + '%';
  edgeAlpha = Math.max(0.03, 1 - v / 100);
  dirty = true;
});
document.getElementById('fanim').addEventListener('change', e => {
  anim = e.target.checked;
  dirty = true;
});
document.getElementById('orbit').addEventListener('click', e => {
  autoOrbit = !autoOrbit;
  e.target.textContent = autoOrbit ? '暂停自转' : '开始自转';
  dirty = true;
});
document.getElementById('fit').addEventListener('click', fitToView);
const panelEl = document.getElementById('panel');
const panelTab = document.getElementById('panelTab');
document.getElementById('panelToggle').addEventListener('click', () => {
  panelEl.classList.add('collapsed');
  panelTab.classList.add('show');
});
panelTab.addEventListener('click', () => {
  panelEl.classList.remove('collapsed');
  panelTab.classList.remove('show');
});
document.getElementById('reset').addEventListener('click', () => {
  yaw = 0.6; pitch = 0.22; zoom = 1;
  panX = 0; panY = 0; pivot = { x: 0, y: 0, z: 0 };
  selected = null; hoverId = null;
  dirty = true; updatePanel();
});
document.getElementById('rn').addEventListener('input', drawChart);
document.getElementById('rt').addEventListener('input', drawChart);

function applyGraph(g) {
  graph = g;
  buildLayout();
  const sel = document.getElementById('ftype');
  const types = [...new Set(g.notes.map(n => n.type))].sort();
  sel.innerHTML = '<option value="">全部类型</option>' +
    types.map(t => `<option value="${t}"${t === filterType ? ' selected' : ''}>${t}</option>`).join('');
  dirty = true;
  updatePanel();
}

function refresh() {
  if (window.__GRAPH__) { applyGraph(window.__GRAPH__); return; }
  fetch('/api/graph').then(r => r.json()).then(applyGraph).catch(() => {});
}

drawChart();
refresh();
setInterval(refresh, 30000);
requestAnimationFrame(frame);
</script>
</body>
</html>
